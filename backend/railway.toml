[build]
builder = "RAILPACK"
buildCommand = "uv sync --frozen --no-dev && uv run --no-sync python manage.py collectstatic --noinput"

[deploy]
preDeployCommand = "uv run --no-sync python manage.py migrate --noinput && uv run --no-sync python manage.py seed_demo"
startCommand = "uv run --no-sync gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
healthcheckPath = "/health/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

