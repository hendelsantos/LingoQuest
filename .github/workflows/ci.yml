name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lingoquest_test
          POSTGRES_USER: lingoquest
          POSTGRES_PASSWORD: lingoquest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingoquest -d lingoquest_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://lingoquest:lingoquest_ci@127.0.0.1:5432/lingoquest_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --all-groups
      - name: Django checks
        working-directory: backend
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

